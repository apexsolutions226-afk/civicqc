<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="robots" content="noindex,nofollow" /><title>CivicQC booking form definition</title></head><body>
  <!-- All React wizard fields are registered here for Netlify Forms detection. Do not add a form-name input: Netlify injects it when it processes this definition. -->
  <form name="civicqc-inspection-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="request_reference" />
    <input type="text" name="service_id" />
    <input type="text" name="service" />
    <input type="text" name="property_type" />
    <input type="text" name="property_size" />
    <input type="text" name="approximate_area_sqft" />
    <input type="text" name="preferred_date" />
    <input type="text" name="name" />
    <input type="text" name="phone" />
    <input type="text" name="email" />
    <input type="text" name="location" />
    <input type="text" name="property_address" />
    <input type="text" name="additional_requirements" />
    <input type="text" name="estimated_professional_fee_inr" />
    <input type="text" name="estimate_basis" />
    <input type="text" name="laboratory_charges" />
    <input type="text" name="consent" />
    <input type="text" name="bot-field" />
  </form>
</body></html>
